<section class="hero hero-{{ page.hero_style | default: 'navy' }}{% if page.url == '/' %} hero-home{% endif %}">
  <div class="container">
    {% if page.eyebrow %}<p class="hero-eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="hero-title">{{ page.hero }}</h1>
    {% if page.hero_lead %}<p class="hero-lead">{{ page.hero_lead }}</p>{% endif %}
    {% if page.hero_buttons %}
    <div class="hero-buttons">
      {% for b in page.hero_buttons %}<a class="btn btn-{{ b.style }}" href="{{ b.url | relative_url }}">{{ b.label }}</a>{% endfor %}
    </div>
    {% endif %}
  </div>
</section>
